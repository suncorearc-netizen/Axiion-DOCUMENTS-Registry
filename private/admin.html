<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Axion HQ</title>
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#14212b;--mute:#5a6b78;--line:#d5dce1;--acc:#0e6b63;--err:#b3261e;--warn:#9a5b00;--wbg:#fff1d6;--ok:#e7f4f1}
@media (prefers-color-scheme:dark){:root{--bg:#10171c;--card:#182229;--ink:#e8eef2;--mute:#9db0bc;--line:#2c3a43;--acc:#3cb3a6;--err:#ff8a80;--warn:#ffc266;--wbg:#3a2f14;--ok:#14302d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
header b{font:700 1.15rem Georgia,serif}
main{max-width:1050px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.link{background:none;border:0;color:var(--acc);font-weight:600;cursor:pointer}
.login{max-width:360px;margin:12vh auto}
.login h1{font:700 1.5rem Georgia,serif;margin:0 0 12px}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
.err{color:var(--err);font-weight:600;min-height:1.2em;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stats b{display:block;font:700 1.7rem Georgia,serif}
.stats span{color:var(--mute);font-size:.85rem}
.bar{display:grid;grid-template-columns:1fr 160px;gap:10px;margin-bottom:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:.85rem}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--ok)}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:700;background:var(--ok);color:var(--acc)}
.tag.issue{background:var(--wbg);color:var(--warn)}.tag.closed{background:var(--line);color:var(--mute)}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--mute)}
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;justify-content:flex-end;z-index:5}
#drawer.on{display:flex}
#panel{background:var(--bg);width:min(620px,100%);height:100%;overflow-y:auto;padding:16px}
dl{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;margin:10px 0}
dt{color:var(--mute)}dd{margin:0;word-break:break-word}
h3{font:700 1.05rem Georgia,serif;margin:18px 0 6px}
.sig{background:#fff;border:1px solid var(--line);border-radius:6px;max-width:260px;display:block}
.idimg{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hide{display:none}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}.bar{grid-template-columns:1fr}.two{grid-template-columns:1fr}dl{grid-template-columns:105px 1fr}}
@media print{body *{visibility:hidden}#panel,#panel *{visibility:visible}#drawer{position:static;background:none;display:block}#panel{position:absolute;left:0;top:0;width:100%;background:#fff;color:#000}.noprint{display:none!important}}
</style>
</head>
<body>

<div id="login-view" class="hide">
  <form class="card login" id="lf">
    <h1>Axion HQ</h1>
    <label for="u">Login ID</label><input id="u" autocomplete="username" required>
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <button class="btn" style="width:100%;margin-top:14px">Log in</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<div id="app-view" class="hide">
  <header><b>Axion HQ</b><span><span id="who" style="margin-right:12px;color:var(--mute)"></span><button class="link" id="logout">Log out</button></span></header>
  <main>
    <div class="stats">
      <div><b id="s_total">-</b><span>Total clients</span></div>
      <div><b id="s_today">-</b><span>Last 24 hours</span></div>
      <div><b id="s_week">-</b><span>Last 7 days</span></div>
      <div><b id="s_issues">-</b><span>Marked "issue"</span></div>
    </div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search name, mobile number, email, Client ID, ID number..." aria-label="Search">
      <select id="sf" aria-label="Status"><option value="">All statuses</option><option value="active">Active</option><option value="issue">Issue</option><option value="closed">Closed</option></select>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Client ID</th><th>Name</th><th>Mobile</th><th>Email</th><th>Signed</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="pg"><span id="count"></span><span><button class="link" id="prev">Previous</button> <button class="link" id="next">Next</button></span></div>
  </main>
</div>

<div id="drawer"><div id="panel"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (t) => (t ? new Date(t).toLocaleString('en-GB', { timeZone: 'Asia/Dhaka' }) : '-');
let page = 0, pageSize = 25, total = 0, timer;

async function api(action, { method = 'GET', body, params = '' } = {}) {
  const r = await fetch(`/api/admin?action=${action}${params}`, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && action !== 'login') { showLogin(); throw new Error('auth'); }
  if (!r.ok) throw new Error(d.error || 'Error');
  return d;
}
function showLogin() { $('app-view').classList.add('hide'); $('login-view').classList.remove('hide'); }
async function showApp(name) {
  $('login-view').classList.add('hide'); $('app-view').classList.remove('hide'); $('who').textContent = name;
  const s = await api('stats');
  $('s_total').textContent = s.total; $('s_today').textContent = s.today; $('s_week').textContent = s.week; $('s_issues').textContent = s.issues;
  load();
}

$('lf').onsubmit = async (e) => {
  e.preventDefault(); $('lerr').textContent = '';
  try { const d = await api('login', { method: 'POST', body: { username: $('u').value, password: $('p').value } }); $('p').value = ''; showApp(d.name); }
  catch (x) { $('lerr').textContent = x.message; }
};
$('logout').onclick = async () => { await api('logout'); showLogin(); };

async function load() {
  const p = `&page=${page}&q=${encodeURIComponent($('q').value)}&status=${$('sf').value}`;
  const d = await api('list', { params: p });
  total = d.total; pageSize = d.pageSize;
  $('rows').innerHTML = d.rows.map((r) => `<tr data-c="${esc(r.code)}"><td><b>${esc(r.code)}</b></td><td>${esc(r.full_name)}${r.business_name ? `<br><small style="color:var(--mute)">${esc(r.business_name)}</small>` : ''}</td><td>${esc(r.phone)}</td><td>${esc(r.email)}</td><td>${when(r.signed_at)}</td><td><span class="tag ${esc(r.status)}">${esc(r.status)}</span></td></tr>`).join('') || '<tr><td colspan="6" style="color:var(--mute)">No clients found.</td></tr>';
  const from = total ? page * pageSize + 1 : 0;
  $('count').textContent = `${from}-${Math.min(total, (page + 1) * pageSize)} of ${total}`;
  $('prev').style.visibility = page > 0 ? 'visible' : 'hidden';
  $('next').style.visibility = (page + 1) * pageSize < total ? 'visible' : 'hidden';
}
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(() => { page = 0; load(); }, 300); };
$('sf').onchange = () => { page = 0; load(); };
$('prev').onclick = () => { page--; load(); };
$('next').onclick = () => { page++; load(); };
$('rows').onclick = (e) => { const tr = e.target.closest('tr[data-c]'); if (tr) openClient(tr.dataset.c); };

async function openClient(code) {
  const c = await api('get', { params: `&code=${encodeURIComponent(code)}` });
  const row = (k, v) => `<dt>${esc(k)}</dt><dd>${esc(v || '-')}</dd>`;
  const f = (id, label, val, type = 'text') => `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val || '')}"></div>`;
  $('panel').innerHTML = `
    <div class="noprint" style="display:flex;justify-content:space-between"><button class="link" id="close">Close</button><button class="btn alt" onclick="print()">Print record</button></div>
    <h2 style="font:700 1.5rem Georgia,serif;margin:8px 0 0">${esc(c.code)}</h2>
    <p style="margin:0;color:var(--mute)">Axion DMS Software Sale and Setup Agreement - signed record</p>
    <div class="card" style="margin-top:12px"><dl>
      ${row('Name', c.full_name)}${row('Business', c.business_name)}${row('Email', c.email)}${row('Mobile', c.phone)}${row('Address', c.address)}${row(c.id_type, c.id_number)}
    </dl></div>
    <h3>Signature and evidence</h3>
    <div class="card"><img class="sig" src="${esc(c.signature_data)}" alt="Signature"><dl>
      ${row('Initials', c.initials)}${row('Signed at', when(c.signed_at) + ' (Dhaka time)')}${row('Agreement version', c.agreement_version)}
      ${row('Document SHA-256', c.agreement_sha256)}${row('IP address', c.ip)}${row('Device', c.user_agent)}
      ${row('Confirmed', 'Read agreement: ' + (c.consents?.read ? 'yes' : 'no') + ' | Understood key points: ' + (c.consents?.understood ? 'yes' : 'no') + ' | Details true and e-signature accepted: ' + (c.consents?.accurate ? 'yes' : 'no'))}
    </dl>${c.photo_url ? `<p class="noprint" style="margin:8px 0 4px;color:var(--mute)">ID photo (link expires in 5 minutes)</p><a class="noprint" href="${esc(c.photo_url)}" target="_blank" rel="noopener"><img class="idimg" src="${esc(c.photo_url)}" alt="ID photo"></a>` : ''}</div>
    <div class="noprint">
    <h3>Handover and internal notes</h3>
    <div class="card">
      <label for="e_status">Status</label>
      <select id="e_status">${['active', 'issue', 'closed'].map((s) => `<option ${s === c.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <div class="two">${f('e_live', 'Live link (Vercel)', c.live_url)}${f('e_handover', 'Handover date', c.handover_date, 'date')}</div>
      <div class="two">${f('e_gh', 'GitHub username', c.github_user)}${f('e_vc', 'Vercel username', c.vercel_user)}</div>
      ${f('e_sb', 'Supabase project name', c.supabase_project)}
      <label for="e_notes">Notes (issues, what was fixed)</label><textarea id="e_notes" rows="4">${esc(c.notes)}</textarea>
      <p style="color:var(--mute);font-size:.85rem;margin:10px 0">Do not store the client's passwords here. The agreement says we keep no access after handover.</p>
      <button class="btn" id="save">Save changes</button> <span id="saved" style="margin-left:8px;font-weight:600"></span>
      ${c.updated_by ? `<p style="color:var(--mute);font-size:.85rem">Last changed by ${esc(c.updated_by)} on ${when(c.updated_at)}</p>` : ''}
    </div></div>`;
  $('drawer').classList.add('on');
  $('close').onclick = () => $('drawer').classList.remove('on');
  $('save').onclick = async () => {
    try {
      await api('update', { method: 'POST', body: { code, fields: { status: $('e_status').value, live_url: $('e_live').value, handover_date: $('e_handover').value, github_user: $('e_gh').value, vercel_user: $('e_vc').value, supabase_project: $('e_sb').value, notes: $('e_notes').value } } });
      $('saved').style.color = 'var(--acc)'; $('saved').textContent = 'Saved'; load();
    } catch (x) { $('saved').style.color = 'var(--err)'; $('saved').textContent = x.message; }
  };
}
$('drawer').onclick = (e) => { if (e.target.id === 'drawer') $('drawer').classList.remove('on'); };

(async () => { try { const d = await api('me'); showApp(d.name); } catch { showLogin(); } })();
</script>
</body>
</html>
